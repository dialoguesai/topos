[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topos-node"
version = "0.1.7"
description = "Topos personal AI engine (FastAPI): local data, sync, control plane WebSocket client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.2",
  "websockets>=12.0",
  "certifi>=2024.2.2",
  "cryptography>=42.0.0",
  "python-multipart>=0.0.6",
  "click>=8.1.0",
  "packaging>=23.0",
  "mcp>=1.0",
  "google-cloud-storage>=3.8.0",
  "google-cloud-run>=0.14.0",
  "networkx>=3.2.1",
  "transformers>=4.57.6",
  "torch>=2.8.0",
  "python-louvain>=0.16",
  "asgi-lifespan>=2.1",
]

[project.urls]
Homepage = "https://topos.dialogues.ai"
Source = "https://dialogues.ai"

[project.optional-dependencies]
engine = [
  "duckdb>=1.0.0",
  "psycopg[binary]>=3.2.0",
]
signal = [
  "pysqlcipher3>=1.0.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[project.scripts]
topos-node = "topos.cli.commands:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topos*", "shared*"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
  "ignore:on_event is deprecated.*:DeprecationWarning:fastapi.*",
]
markers = [
  "public: public-safe test lane for OSS CI",
  "private: internal architecture or fixtures; excluded from public CI",
  "e2e: end-to-end tests (live Keycloak + Control Plane; require config and running CP)",
]
testpaths = ["tests"]
