[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topos-node"
version = "1.3.10"
description = "Topos personal AI engine (FastAPI): local data, sync, control plane WebSocket client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi~=0.136.0",
  "uvicorn[standard]~=0.44.0",
  "httpx~=0.28.1",
  "pydantic~=2.13.2",
  "pydantic-settings~=2.13.1",
  "websockets>=16.0,<16.1",
  "certifi~=2026.2.25",
  "cryptography~=46.0.7",
  "python-multipart>=0.0.26,<0.0.27",
  "click~=8.4.1",
  "packaging>=26.1,<26.2",
  "mcp~=1.27.0",
  "google-cloud-storage~=3.10.1",
  "google-cloud-run~=0.16.0",
  "asgi-lifespan~=2.1.0",
  "psycopg[binary]~=3.3.3",
  "duckdb~=1.5.2",
  "torch>=2.8.0,<2.13",
  "transformers~=5.10.2",
  "huggingface-hub~=1.18.0",
  "tqdm~=4.67.3",
  "hf-xet~=1.5.1",
  "sentence-transformers~=5.6.0",
  "networkx>=3.2.1,<3.7",
  "python-louvain>=0.16,<0.17",
  # openCypher over the materialised entity graph, owner-only
  # (topos.features.entities.cypher; PLAN_GRAPH_QUERY_AND_LATENT_EDGES §4).
  # Pure-Python parser (lark) + matcher over networkx — no graph database.
  "grand-cypher>=0.12,<0.13",
  # Complexity readings (topos.features.complexity): entropy/MI + graph math.
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "sqlite-vec~=0.1.9",
  # Menu-bar/system-tray status icon (topos.cli.tray). Imported lazily and
  # only when a GUI session is detected — harmless on headless installs.
  "pystray~=0.19.5",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://topos.dialogues.ai"
Source = "https://dialogues.ai"

[project.optional-dependencies]
# Lean database / sync plane (hosted topos-database Cloud Run image).
database = [
  "psycopg[binary]~=3.3.3",
]
# ML + enrichment runtime (hosted topos-engine Cloud Run image).
engine = [
  "duckdb~=1.5.2",
  "torch>=2.8.0,<2.13",
  "transformers~=5.10.2",
  "huggingface-hub~=1.18.0",
  "tqdm~=4.67.3",
  "hf-xet~=1.5.1",
  "sentence-transformers~=5.6.0",
  "networkx>=3.2.1,<3.7",
  "python-louvain>=0.16,<0.17",
  "grand-cypher>=0.12,<0.13",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
]
# Backward-compatible alias; local runtime deps are in core dependencies.
local = []
signal = [
  "pysqlcipher3~=1.2.0",
]
dev = [
  "pytest~=9.0.3",
  "pytest-asyncio~=1.3.0",
  "httpx~=0.28.1",
]

[project.scripts]
topos-node = "topos.cli.commands:main"

[tool.setuptools]
# Data files (scope_registry.json, signal definitions, …) must ship in the wheel —
# a wheel without them serves a node that denies every scoped query (missing
# topos/query/scope_registry.json). Patterns live in MANIFEST.in.
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["topos*", "shared*"]

[tool.pytest.ini_options]
# tmp_path hygiene: this suite's fixtures build whole node DBs (100s of MB per
# run). Keep only the last run's FAILED dirs — passed dirs are removed as tests
# finish, so tmp never accumulates across runs. Killed runs can still leave
# locked roots behind; topos.runtime_housekeeping sweeps those on node start.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
  "ignore:on_event is deprecated.*:DeprecationWarning:fastapi.*",
]
markers = [
  "journey: binds this test to a J-* journey note in topos-ops-wiki (the id is the marker arg)",
  "check: binds this test to a C-* check note in topos-ops-wiki (the id is the marker arg)",
  "gap: gap verification test (sprint pack); must pass after sprint lands",
  "qq_eval: live query quality/latency eval against owner database",
  "acceptance: Wiki MVP acceptance test (AT-1 through AT-8)",
  "hosted_parity: hosted vs local parity (staging/nightly)",
  "public: public-safe test lane for OSS CI",
  "private: internal architecture or fixtures; excluded from public CI",
  "e2e: end-to-end tests (live Keycloak + Control Plane; require config and running CP)",
  "live: requires a running local engine (localhost:9000) and a real TOPOS_KEY; excluded from deterministic lanes",
  "release_pressure: iteration-4 live pressure smoke; run explicitly before releases",
  "p0: priority marker on release pressure tests",
  "retrieval_eval: dense-intelligence retrieval eval (loads local embedding model; run explicitly)",
  "adversarial: scope-break / access-control adversarial test (privacy enforcement)",
  "uar: unauthorized-access-rate probe (privacy claim #1); tier-1 CI gate, must find zero leaks",
  "cer: canary-extraction-rate probe (privacy claim #2); tier-1 CI gate",
  "bhlr: black-hole leak-rate probe (entity black hole); tier-1 CI gate, must find zero leaks",
  "eval_nightly: statistical privacy eval (attacker advantage, minimality, latency); nightly",
  "eval_release: release-tier privacy eval (negotiation A/B, Pareto); run per release",
]
pythonpath = ["tests/gap/p3/engine", "tests/gap/p4/engine", "tests/gap/qq/engine", "tests/acceptance/wiki_mvp", "tests/evals/time_signal"]
testpaths = ["tests"]
