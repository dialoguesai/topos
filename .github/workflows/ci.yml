name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One run per workflow and ref: a newer push cancels the run it supersedes, on
# main as well as on a PR branch. On 2026-09-25 six merges to main inside two
# minutes started six full runs, and all six ran to completion in parallel
# although only the newest could say anything about main. Same shape as the
# control-plane's ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The public lane, one job per slice (tests/lane_shards.py). Each slice runs
  # `just gate`'s lane command plus `--lane-shard`, which deselects what the
  # slice does not own after collection; `rest` owns whatever no other slice
  # claims, so together the slices are that lane exactly. Unsplit it took
  # 36-39 minutes on 2026-09-25, and the slices measured 8.8-9.6 minutes of
  # tests each inside those runs.
  public-lane:
    name: public lane (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every slice runs to its end, so a red run still reports its whole
      # failed set. With fail-fast the first red slice would cancel the others.
      fail-fast: false
      matrix:
        # tests/test_lane_shards.py fails when this list and the table in
        # tests/lane_shards.py disagree.
        shard: [permissions_v2, message_search_gap, features_topos_core, rest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra local

      - name: Verify dependency pins match lockfile
        run: python scripts/sync-dep-pins.py --check

      - name: Verify migration registry checksums
        run: python scripts/sync_migration_checksums.py --check

      - name: Spec-version nudge for enrichment/model diffs
        run: python scripts/check_spec_version_nudge.py
        env:
          TOPOS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

      - name: Run public test lane
        id: lane
        # `shell: bash` runs with pipefail, so pytest's exit status survives tee.
        shell: bash
        run: uv run pytest tests -m "public and not e2e and not live and not qq_eval" -q --lane-shard ${{ matrix.shard }} | tee lane.log

      - name: Failed set to the run summary
        # The run's summary page shows this block from every slice: one page
        # for the whole failed set instead of four job logs. The guard headers
        # explain a red slice with no FAILED line (tests/conftest.py).
        if: ${{ !cancelled() && steps.lane.outcome != 'skipped' }}
        shell: bash
        run: |
          {
            echo "### public lane (${{ matrix.shard }}): ${{ steps.lane.outcome }}"
            echo '```text'
            grep -E '^(FAILED|ERROR) |^Interrupted:|^=+ (module state leaked|engine threads outlived|tests (reached|tried to reach) the owner)|^[0-9]+ [a-z]+.* in [0-9.]+s|^no tests ran' lane.log \
              || echo "no pytest summary line; read this job's log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The steps after the first are unchanged, and gated on every lane slice.
  # This job runs even when a slice is red, so that this check goes red with the
  # lane, as it did when the lane was a step in it. Skipped behind a failed
  # `needs`, it would report "skipped", which GitHub counts as passing for a
  # required check.
  test-and-package:
    needs: public-lane
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Public lane passed
        # Fails the job when any slice did not pass, which skips every step
        # below, as a red lane skipped them before.
        if: ${{ needs.public-lane.result != 'success' }}
        run: |
          echo "::error::public lane: ${{ needs.public-lane.result }}; the steps below are skipped"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra local

      - name: Guard against private repo references
        run: |
          ! rg -n "topos-enterprise|topos_enterprise|topos-node-enterprise" \
            --glob '!tests/test_extensions.py' \
            --glob '!.github/**' \
            .

      # The Home chat Wave A retrieval-quality gates (query catalog 70/70 on
      # permission / signal / quality, multi-turn catalog, harness evaluation)
      # do NOT run here. They drive demo/signal_dimension_harness, whose fixture
      # data cannot ship in this repo, so `demo/` is gitignored and the scripts
      # never exist in a CI checkout — this step failed on every run from
      # 2026-07-05 until it was removed, keeping main permanently red and
      # masking real regressions in the steps after it.
      #
      # Run them locally instead: `just harness-gate` (see justfile).
      #
      # The routing/retrieval pytest files this step also ran
      # (tests/query/test_retrieval_*, test_resolve_source_ids_installed_filter,
      # test_fingerprint_invalidation, test_query_multi_turn_cache) are all in
      # the public lane above, which collects the same 17 tests — no coverage
      # is lost by dropping the duplicate invocation.
      #
      # CP-side integration (scope_query_router, adversarial privacy) runs in
      # the control-plane repo's CI, which checks this engine out as a sibling.
      # This workflow must stay self-contained: no ../ references.

      - name: Privacy firewall + eval gates
        # The privacy evals are marked `private` (excluded from the public lane by design), so
        # run them by path here: UAR/CER (zero-leak), minimality (sensitive-excess=0),
        # negotiation ratchet, minimizer subset/injection, disclosure idempotence + existence
        # parity + phone/date redaction, cache isolation, and the dense-artifact sparsification
        # gates. Deterministic (no live LLM). The CP-side adversarial probes run in the
        # control-plane repo's CI (its hermetic suite includes tests/adversarial).
        run: uv run pytest tests/evals/privacy/ -q

      - name: Build package artifacts
        run: uv build

      - name: Validate package metadata
        run: uvx --from twine twine check dist/*

      - name: Fresh-install smoke test (wheel)
        run: python scripts/release_smoke_test.py
