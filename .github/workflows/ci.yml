name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra local

      - name: Verify dependency pins match lockfile
        run: python scripts/sync-dep-pins.py --check

      - name: Verify migration registry checksums
        run: python scripts/sync_migration_checksums.py --check

      - name: Spec-version nudge for enrichment/model diffs
        run: python scripts/check_spec_version_nudge.py
        env:
          TOPOS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

      - name: Run public test lane
        run: uv run pytest tests -m "public and not e2e and not live and not qq_eval" -q

      - name: Guard against private repo references
        run: |
          ! rg -n "topos-enterprise|topos_enterprise|topos-node-enterprise" \
            --glob '!tests/test_extensions.py' \
            --glob '!.github/**' \
            .

      # The Home chat Wave A retrieval-quality gates (query catalog 70/70 on
      # permission / signal / quality, multi-turn catalog, harness evaluation)
      # do NOT run here. They drive demo/signal_dimension_harness, whose fixture
      # data cannot ship in this repo, so `demo/` is gitignored and the scripts
      # never exist in a CI checkout — this step failed on every run from
      # 2026-07-05 until it was removed, keeping main permanently red and
      # masking real regressions in the steps after it.
      #
      # Run them locally instead: `just harness-gate` (see justfile).
      #
      # The routing/retrieval pytest files this step also ran
      # (tests/query/test_retrieval_*, test_resolve_source_ids_installed_filter,
      # test_fingerprint_invalidation, test_query_multi_turn_cache) are all in
      # the public lane above, which collects the same 17 tests — no coverage
      # is lost by dropping the duplicate invocation.
      #
      # CP-side integration (scope_query_router, adversarial privacy) runs in
      # the control-plane repo's CI, which checks this engine out as a sibling.
      # This workflow must stay self-contained: no ../ references.

      - name: Privacy firewall + eval gates
        # The privacy evals are marked `private` (excluded from the public lane by design), so
        # run them by path here: UAR/CER (zero-leak), minimality (sensitive-excess=0),
        # negotiation ratchet, minimizer subset/injection, disclosure idempotence + existence
        # parity + phone/date redaction, cache isolation, and the dense-artifact sparsification
        # gates. Deterministic (no live LLM). The CP-side adversarial probes run in the
        # control-plane repo's CI (its hermetic suite includes tests/adversarial).
        run: uv run pytest tests/evals/privacy/ -q

      - name: Build package artifacts
        run: uv build

      - name: Validate package metadata
        run: uvx --from twine twine check dist/*

      - name: Fresh-install smoke test (wheel)
        run: python scripts/release_smoke_test.py
