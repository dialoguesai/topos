name: Ratings read diagnostic (not release evidence)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra local
      - name: Profile CI test order through the ratings read
        run: uv run python scripts/profile_rating_ci.py tests -m 'public and not e2e and not live and not qq_eval' --lane-shard rest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratings-read-profile
          path: rating-diagnostic.*
