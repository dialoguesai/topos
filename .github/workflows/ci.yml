name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra engine

      - name: Verify dependency pins match lockfile
        run: python scripts/sync-dep-pins.py --check

      - name: Run public test lane
        run: uv run pytest tests -m "public and not e2e" -q

      - name: Build package artifacts
        run: uv build

      - name: Validate package metadata
        run: uvx --from twine twine check dist/*
