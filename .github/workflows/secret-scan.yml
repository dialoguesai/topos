name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

env:
  # Same pin as .pre-commit-config.yaml, so a developer's hook and CI agree on
  # what counts as a secret.
  GITLEAKS_VERSION: 8.28.0

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to resolve the pushed/PR range below. The scan itself stays
          # bounded to that range; see "Scan incoming commits".
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Verify scanner config
        # The control plane's suite carries matching assertions, but its CI
        # checks this repo out at the pinned compat tag — which predates these
        # files — so that copy can only ever fail on a developer's laptop. This
        # step is the one that can block a pull request here.
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          version = "8.28.0"
          problems = []

          hook = pathlib.Path(".pre-commit-config.yaml")
          if not hook.is_file():
              problems.append("no .pre-commit-config.yaml: nothing scans before a commit")
          elif f"rev: v{version}" not in hook.read_text():
              problems.append(
                  f"the pre-commit hook is not pinned to v{version}, so it and this "
                  "job disagree about what counts as a secret"
              )

          # Join backslash continuations first: a scope check that reads one
          # physical line at a time is defeated by ordinary shell formatting.
          source = pathlib.Path(".github/workflows/secret-scan.yml").read_text()
          logical, buffer = [], ""
          for raw in source.splitlines():
              line = raw.strip()
              if line.startswith("#"):
                  continue
              if line.endswith("\\"):
                  buffer += line[:-1].rstrip() + " "
                  continue
              logical.append((buffer + line).strip())
              buffer = ""
          if buffer:
              logical.append(buffer.strip())

          commit_scans = []
          for line in logical:
              tokens = line.split()
              if "gitleaks" not in tokens:
                  continue
              if "git" in tokens[tokens.index("gitleaks") + 1:]:
                  commit_scans.append(line)

          if not commit_scans:
              problems.append("nothing scans the commits a push or pull request introduces")
          for line in commit_scans:
              if "--log-opts" not in line and "--staged" not in line:
                  problems.append(
                      "unbounded history scan; it grows monotonically and gets switched "
                      f"off the first time it is unfixably red: {line}"
                  )

          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Write baseline
        # Kept here rather than at the repo root so the engine tree carries no
        # scanner config of its own. One fingerprint, not a path exemption: a
        # real secret elsewhere in that file still fails.
        run: |
          cat > "${RUNNER_TEMP}/.gitleaksignore" <<'EOF'
          # Triaged 2026-07-31 (W0.3). `inj-canary-secret-5150` is the prompt-injection
          # canary the privacy eval asserts never leaves the minimizer.
          tests/evals/privacy/cer/test_cer_with_minimizer.py:generic-api-key:102
          EOF

      - name: Scan working tree
        run: |
          gitleaks dir . \
            --gitleaks-ignore-path "${RUNNER_TEMP}/.gitleaksignore" \
            --redact --no-banner --verbose --exit-code 1

      - name: Scan incoming commits
        # A range, never the whole log. History scans grow monotonically with
        # the repo and a single unfixable old finding turns the job into noise
        # that gets switched off.
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          if [ "${RANGE%%..*}" = "0000000000000000000000000000000000000000" ]; then
            echo "branch created: no predecessor to diff against; the working-tree scan covers it"
            exit 0
          fi
          gitleaks git . --log-opts "$RANGE" \
            --gitleaks-ignore-path "${RUNNER_TEMP}/.gitleaksignore" \
            --redact --no-banner --verbose --exit-code 1
