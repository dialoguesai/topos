name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Release install smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Ensure tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          if not tag.startswith("v"):
              raise SystemExit(f"Expected a v-prefixed tag, got: {tag}")
          tag_version = tag[1:]

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = data["project"]["version"]

          if tag_version != package_version:
              raise SystemExit(
                  f"Tag/version mismatch: tag={tag_version}, pyproject={package_version}"
              )
          print(f"Version check passed: {package_version}")
          Path("/tmp/topos-release-version").write_text(package_version, encoding="utf-8")
          PY

      - name: Verify release artifacts (manifest, changelog, checksums)
        run: |
          VERSION="$(cat /tmp/topos-release-version)"
          python scripts/check_release_artifacts.py --version "${VERSION}"

      - name: Build package artifacts
        run: uv build

      - name: Validate package metadata
        run: uvx --from twine twine check dist/*

      - name: Fresh-install smoke test (wheel)
        run: python scripts/release_smoke_test.py

      - name: Upgrade smoke test (PyPI -> wheel)
        run: python scripts/release_smoke_test.py --test-upgrade

      # PLAN M4: cheap catch-up check — from-current fixture stamped at the
      # previous patch baseline, then ensure_migrations + run_pending_upgrades
      # under the tagged checkout. Full nightly matrix lives in upgrade-matrix.yml
      # (PyPI wheel installs when available).
      - name: Upgrade matrix (from-current prior baseline)
        run: |
          uv sync --extra dev --extra local
          PRIOR="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          ver = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          parts = [int(p) for p in ver.split(".")[:3]]
          while len(parts) < 3:
              parts.append(0)
          if parts[2] > 0:
              parts[2] -= 1
          elif parts[1] > 0:
              parts[1] -= 1
              parts[2] = 0
          else:
              parts = [1, 3, 2]  # support-floor fallback
          print(".".join(str(p) for p in parts))
          PY
          )"
          echo "Building from-current fixture with baseline=${PRIOR}"
          uv run python scripts/build_upgrade_fixture.py \
            --from-current --version "${PRIOR}" --out /tmp/publish-upgrade-fixture.db
          uv run python scripts/run_upgrade_matrix.py --db /tmp/publish-upgrade-fixture.db

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: smoke

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
