name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Release install smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Ensure tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          if not tag.startswith("v"):
              raise SystemExit(f"Expected a v-prefixed tag, got: {tag}")
          tag_version = tag[1:]

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = data["project"]["version"]

          if tag_version != package_version:
              raise SystemExit(
                  f"Tag/version mismatch: tag={tag_version}, pyproject={package_version}"
              )
          print(f"Version check passed: {package_version}")
          Path("/tmp/topos-release-version").write_text(package_version, encoding="utf-8")
          PY

      - name: Verify release artifacts (manifest, changelog, checksums)
        run: |
          VERSION="$(cat /tmp/topos-release-version)"
          python scripts/check_release_artifacts.py --version "${VERSION}"

      - name: Build package artifacts
        run: uv build

      - name: Validate package metadata
        run: uvx --from twine twine check dist/*

      - name: Fresh-install smoke test (wheel)
        run: python scripts/release_smoke_test.py

      - name: Upgrade smoke test (PyPI -> wheel)
        run: python scripts/release_smoke_test.py --test-upgrade

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: smoke

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
