# Install once per checkout — ALL THREE stages:
#   uvx pre-commit install
#   uvx pre-commit install --hook-type commit-msg
#   uvx pre-commit install --hook-type pre-push
#
# `pre-commit install` alone wires the pre-commit stage only, which scans FILES
# and leaves the commit MESSAGE unscanned. The `no-owner-data-installed` hook
# below refuses to commit until the second line has been run, so a checkout
# cannot quietly end up half-guarded the way gitleaks did (see below).
#
# The upstream hook runs `gitleaks git --pre-commit --redact --staged --verbose`,
# so it sees only what is about to be committed. This repo is public and has no
# known leak, so it scans against the stock upstream ruleset with no local
# config to drift.
#
# The one known false positive (an injection canary in
# tests/evals/privacy/cer/test_cer_with_minimizer.py) is triaged in
# .github/workflows/secret-scan.yml. If the hook fires on something that is
# genuinely not a secret, add a `gitleaks:allow` comment on that line rather
# than exempting the file.
#
# Hook order is deliberate. The Smithers run guard is first and `fail_fast`, so
# when a run owns the tree nothing else runs and the refusal is the only output.
# It used to live as a hand-written .git/hooks/pre-commit, which meant it WAS the
# repo's pre-commit hook — `pre-commit install` had never been run here, so the
# gitleaks hook below it had been inert since July. On a public repo that is the
# expensive kind of inert: CI catches the same secret, but only once it is
# already in history. Owning one file each was the whole problem; pre-commit owns
# the file now and the guard is a hook inside it.
repos:
  - repo: local
    hooks:
      - id: smithers-run-guard
        name: no commits while a Smithers run owns the tree
        entry: python3 scripts/check_smithers_run_guard.py
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true

      # gitleaks catches secrets. This catches the other thing a privacy product
      # must never publish: the owner's OWN data, pasted into a docstring or a
      # test fixture while measuring something. Those are invisible to the
      # derived-layer privacy sweeps, which operate on the database and never
      # look at source. On 2026-08-27 a remediation branch was one command away
      # from committing a BLACK-HOLED entity name — the owner's explicit "hide
      # this" — into five files, two of them the black-hole tests themselves.
      # Skips cleanly where there is no local database, so CI and fresh clones
      # are unaffected.
      # Fails until `pre-commit install --hook-type commit-msg` has been run.
      # Without it the message guard is silently absent, which is exactly how
      # this repo lost gitleaks for a month.
      - id: no-owner-data-installed
        name: the commit-message guard is wired into this checkout
        entry: python3 scripts/scan_repo_for_owner_data.py --verify-install
        language: system
        pass_filenames: false
        always_run: true

      - id: no-owner-data
        name: no personal data from the local node in committed source
        entry: python3 scripts/scan_repo_for_owner_data.py
        language: system
        types: [text]

      # The message is its own leak surface, and a worse one: it publishes with
      # the commit, no file scan covers it, and fixing it after a push means
      # rewriting history. The file hook above passed a commit whose own message
      # named a home address and a real goal, which is how this stage came to
      # exist.
      # `git commit --no-verify` skips every hook above, and nothing inside a
      # hook can prevent that — it is a git built-in, and GitHub allows no
      # custom pre-receive hook outside Enterprise. What CAN be done is a
      # second gate at the point data actually leaves the machine.
      #
      # Skipping commit hooks is often reflexive (they are slow, the change is
      # trivial); pushing is a deliberate act with a different weight. This
      # re-scans the whole tree before anything leaves, so a --no-verify commit
      # is caught while it is still local and fixable without a history
      # rewrite. `git push --no-verify` still bypasses it, but that is now two
      # deliberate refusals rather than one habit.
      - id: no-owner-data-before-push
        name: no personal data leaves this machine
        entry: python3 scripts/scan_repo_for_owner_data.py --all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: no-owner-data-in-message
        name: no personal data from the local node in the commit message
        entry: python3 scripts/scan_repo_for_owner_data.py --message-file
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
